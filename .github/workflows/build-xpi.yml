name: Build XPI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'update-*.json'
      - 'update.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install zip/unzip (Windows)
        if: runner.os == 'Windows'
        run: choco install zip unzip -y

      - name: Install zip (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Download llama.cpp headers (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          LLAMA_VERSION=b8252
          TARBALL=/tmp/llama-src.tar.gz
          curl -L -o "${TARBALL}" "https://github.com/ggml-org/llama.cpp/archive/refs/tags/${LLAMA_VERSION}.tar.gz"
          tar -xzf "${TARBALL}" -C /tmp
          LLAMA_DIR=$(ls /tmp | grep "llama.cpp-${LLAMA_VERSION}" | head -1)
          echo "LLAMA_INCLUDE=/tmp/${LLAMA_DIR}/include:/tmp/${LLAMA_DIR}/ggml/include" >> $GITHUB_ENV

      - name: Download llama.cpp headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "b8252"
          $zip = "$env:TEMP\\llama-src.zip"
          Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/archive/refs/tags/$version.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:TEMP -Force
          $dir = Get-ChildItem $env:TEMP -Directory -Filter "llama.cpp-$version*" | Select-Object -First 1
          $inc = "$($dir.FullName)\\include;$($dir.FullName)\\ggml\\include"
          "LLAMA_INCLUDE=$inc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prune other platform libs
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)
              rm -rf plugin/chrome/content/lib/linux plugin/chrome/content/lib/win32
              ;;
            Linux)
              rm -rf plugin/chrome/content/lib/darwin plugin/chrome/content/lib/win32 plugin/chrome/content/bin/darwin
              ;;
            Windows)
              rm -rf plugin/chrome/content/lib/darwin plugin/chrome/content/lib/linux plugin/chrome/content/bin/darwin
              ;;
          esac

      - name: Bundle native libraries
        shell: bash
        run: |
          node scripts/bundle-native.js --current

      - name: Build llama-helper (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node scripts/build-llama-helper.js --include "${LLAMA_INCLUDE}"

      - name: Build llama-helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/build-llama-helper.js --include "$env:LLAMA_INCLUDE"

      - name: Build XPI
        shell: bash
        run: node scripts/build.js --platform ${{ matrix.name }}

      - name: Rename artifact
        shell: bash
        run: mv zotero-easytrans.xpi "zotero-easytrans-${{ matrix.name }}.xpi"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-easytrans-${{ matrix.name }}
          path: zotero-easytrans-${{ matrix.name }}.xpi

  release:
    name: Create Release (if tag missing)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./plugin/manifest.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Check tag exists
        id: tag
        run: |
          git fetch --tags
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generateReleaseNotes: true
          artifacts: "dist/**/*.xpi"
          artifactErrorsFailBuild: true
          commit: ${{ github.sha }}

      - name: Generate update JSON files
        if: steps.tag.outputs.exists == 'false'
        run: node scripts/generate-update-json.js

      - name: Commit update JSON files
        if: steps.tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json update-macos.json update-windows.json update-linux.json
          git diff --cached --quiet && exit 0
          git commit -m "Update update-*.json for ${{ steps.version.outputs.tag }}"
          git push origin main
